<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>

<style>
    body{
        margin: 0px;
        background-color: #f2f2f2;
    }
    button{
        background-color: blue;
        color: white;
        font-size: 16px;
        width: 300px;
        padding: 6px;
        cursor: pointer;
    }
    input{
        width: 300px;
        padding: 6px;
        font-size: 15px;
        padding-left: 2px;

    }
    .container{
        width: 300px;
        height: 200px;
        background-color: white;
        border-color: (#ccc);
        border-radius: 8px;
        border: 1px solid;
        text-align: center;
        padding: 20px;
        margin-top: 10%;
        
        
    }
</style>


<body>
    <center>
    <div class="container">
        
            <b><h2>Login</h2></b>
            <form>
                <input type="text" placeholder="Enter Your Username" required><br><br>
                <input type="password" placeholder="Enter Your Password" required><br><br>
                <button type="submit">Login</button>
            </form>
        
    </div>
    </center>
</body>
</html>
